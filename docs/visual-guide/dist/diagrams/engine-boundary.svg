<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">From Odin source to a Godot scene</title><desc id="desc">Scriptgen generates bindings. The Odin compiler builds a scripts library. The core GDExtension loads it and bridges the scene tree. Pure Replay models also run without Godot.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1L7 4L0 7" fill="none" stroke="#58645c" stroke-width="1.2"/></marker></defs><rect width="1000" height="320" fill="#fafbf7"/><text x="30" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#b84424" text-anchor="start">BUILD TIME</text><rect x="30" y="60" width="185" height="86" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="47" y="89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">scripts/*.odin</text><text x="47" y="113" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Structs + procedures</text><path d="M215 103L248 103" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="250" y="60" width="200" height="86" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="267" y="89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">scriptgen</text><text x="267" y="113" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Registration + bindings</text><path d="M450 103L483 103" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="485" y="60" width="200" height="86" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="502" y="89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Odin compiler</text><text x="502" y="113" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Authored + generated code</text><path d="M685 103L718 103" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="720" y="60" width="250" height="86" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="737" y="89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Scripts library</text><text x="737" y="113" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">libodinscripts · platform binary</text><path d="M845 146L845 207" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="858" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">loaded by</text><rect x="720" y="210" width="250" height="81" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="737" y="239" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Core GDExtension</text><text x="737" y="263" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">odin_godot · language + loader</text><path d="M720 250L687 250" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="485" y="210" width="200" height="81" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="502" y="239" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Godot scene tree</text><text x="502" y="263" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Nodes · editor · signals</text><text x="30" y="203" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#b84424" text-anchor="start">ENGINE-FREE PATH</text><rect x="30" y="221" width="385" height="70" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="47" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Pure Replay model → Odin executable</text><text x="47" y="274" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Same gameplay; no scenes or sockets required.</text></svg>
