<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">A Kit command from prediction to authority</title><desc id="desc">The client predicts only the target chest. The authority validates and mutates the chest, then credits the bag in its command hook. Accepted fields replicate; rejection reverts the client target.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1L7 4L0 7" fill="none" stroke="#58645c" stroke-width="1.2"/></marker></defs><rect width="1000" height="490" fill="#fafbf7"/><text x="175" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">CLIENT</text><text x="550" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">AUTHORITY</text><text x="840" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">SHARED STATE</text><path d="M175 52L175 410" fill="none" stroke="#c8d1c1" stroke-width="1.5"/><path d="M550 52L550 410" fill="none" stroke="#c8d1c1" stroke-width="1.5"/><path d="M840 52L840 410" fill="none" stroke="#c8d1c1" stroke-width="1.5"/><rect x="48" y="72" width="254" height="61" rx="5" fill="#e9f0fb" stroke="#c8d1c1"/><text x="65" y="101" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Predict chest_take</text><text x="65" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Change the chest target only.</text><path d="M175 157L550 157" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">Take(slot, count, position)</text><rect x="433" y="185" width="234" height="66" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="450" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Check + mutate chest</text><text x="450" y="238" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Range · availability · predicate</text><path d="M550 166L550 183" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M550 251L550 272" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="433" y="275" width="234" height="66" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="450" y="304" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Authority command hook</text><text x="450" y="328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">On success: credit the bag.</text><path d="M667 307L840 307" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="752" y="293" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#58645c" text-anchor="middle">accepted fields</text><path d="M550 375L175 375" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="364" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="middle">Verdict + authoritative target state</text><text x="48" y="441" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#365b41" text-anchor="start">ACCEPT</text><text x="128" y="441" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#202925" text-anchor="start">Prediction stands; replicated fields converge.</text><text x="48" y="469" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#b84424" text-anchor="start">REJECT</text><text x="128" y="469" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#202925" text-anchor="start">Revert the chest prediction; no bag credit is issued.</text></svg>
