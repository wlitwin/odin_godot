<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Restore and replay a speculative suffix</title><desc id="desc">The old timeline has player A winning at tick one. Restore frame zero, replace the input, replay ticks one through eight with player B winning. Compare occurrence identities and replace or cancel effects outside the simulation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1L7 4L0 7" fill="none" stroke="#58645c" stroke-width="1.2"/></marker></defs><rect width="1000" height="360" fill="#fafbf7"/><text x="30" y="35" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="start">A REVISED INPUT AT TICK 1</text><text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#202925" text-anchor="start">Predicted</text><text x="30" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#202925" text-anchor="start">Rebuilt</text><text x="30" y="302" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#202925" text-anchor="start">Effects</text><rect x="175" y="45" width="64" height="56" rx="5" fill="#e5eadd" stroke="#c8d1c1"/><text x="207" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T0</text><text x="207" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 0</text><rect x="175" y="159" width="64" height="56" rx="5" fill="#e5eadd" stroke="#c8d1c1"/><text x="207" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T0</text><text x="207" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">B: 0</text><path d="M241 187L259 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="262" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="294" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T1</text><text x="294" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 5</text><rect x="262" y="159" width="64" height="56" rx="5" fill="#f3e4d8" stroke="#c8d1c1"/><text x="294" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T1</text><text x="294" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M328 187L346 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="349" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="381" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T2</text><text x="381" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 5</text><rect x="349" y="159" width="64" height="56" rx="5" fill="#f3e4d8" stroke="#c8d1c1"/><text x="381" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T2</text><text x="381" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M415 187L433 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="436" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="468" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T3</text><text x="468" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 5</text><rect x="436" y="159" width="64" height="56" rx="5" fill="#f3e4d8" stroke="#c8d1c1"/><text x="468" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T3</text><text x="468" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M502 187L520 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="523" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="555" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T4</text><text x="555" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 5</text><rect x="523" y="159" width="64" height="56" rx="5" fill="#f3e4d8" stroke="#c8d1c1"/><text x="555" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T4</text><text x="555" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M589 187L607 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="610" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="642" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T5</text><text x="642" y="88" font-family="ui-monospace, SFMono-Regul