las, monospace" font-size="11" fill="#58645c" text-anchor="middle">T7</text><text x="816" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M850 187L868 187" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="871" y="45" width="64" height="56" rx="5" fill="#e9f0fb" stroke="#c8d1c1" stroke-dasharray="4 3"/><text x="903" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T8</text><text x="903" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="middle">A: 5</text><rect x="871" y="159" width="64" height="56" rx="5" fill="#f3e4d8" stroke="#c8d1c1"/><text x="903" y="181" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#58645c" text-anchor="middle">T8</text><text x="903" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="middle">B: 5</text><path d="M207 103L207 155" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="229" y="134" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#58645c" text-anchor="start">Restore T0. Replace input 1. Stage the complete suffix before publishing.</text><path d="M175 249L935 249" fill="none" stroke="#c8d1c1" stroke-width="1.5"/><text x="175" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b84424" text-anchor="start">Cancel A’s take</text><text x="455" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#b84424" text-anchor="start">Begin B’s take</text><text x="715" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#365b41" text-anchor="start">Keep unchanged effects</text><text x="175" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Identity changes at tick 1.</text><text x="455" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">New winner, new occurrence.</text><text x="715" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Same ID + payload → no duplicate.</text><text x="175" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Local input revision illustrates the mechanism. Network correction ingests verified authority state.</text></svg>
