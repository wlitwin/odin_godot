<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Replay authoritative runner</title><desc id="desc">The client samples controls and issues actions, predicts through its runner, stores complete history and draws copied views. The authority steps the same game model and returns authoritative state and occurrence history. Verified corrections replace a checkpoint and replay the client suffix.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1L7 4L0 7" fill="none" stroke="#58645c" stroke-width="1.2"/></marker></defs><rect width="1000" height="450" fill="#fafbf7"/><rect x="30" y="40" width="460" height="367" rx="5" fill="#fafbf7" stroke="#c8d1c1" stroke-dasharray="5 5"/><rect x="620" y="40" width="350" height="367" rx="5" fill="#fafbf7" stroke="#c8d1c1" stroke-dasharray="5 5"/><text x="50" y="68" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#2461d9" text-anchor="start">PREDICTING CLIENT</text><text x="640" y="68" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b84424" text-anchor="start">AUTHORITY</text><rect x="50" y="92" width="220" height="76" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="67" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Sample / issue intent</text><text x="67" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Controls: tick · actions: sequence</text><path d="M270 128L643 128" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="448" y="111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="middle">admitted input</text><path d="M155 168L155 221" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170" y="198" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">local response</text><rect x="50" y="224" width="200" height="80" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="67" y="253" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Prediction runner</text><text x="67" y="277" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Step the same game model</text><path d="M250 263L283 263" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="285" y="224" width="185" height="80" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="302" y="253" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Frame history</text><text x="302" y="277" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">State + input + events</text><path d="M378 304L378 333" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="285" y="336" width="185" height="54" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="302" y="365" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Godot views</text><rect x="645" y="92" width="300" height="76" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="662" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Authority runner</text><text x="662" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Validate · order · step game model</text><path d="M795 168L795 221" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="645" y="224" width="300" height="80" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="662" y="253" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Settled state + occurrences</text><text x="662" y="277" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Recorded decisions and complete facts</text><path d="M645 263L472 263" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="554" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="middle">verify + correct</text><text x="645" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#58645c" text-anchor="start">Snapshots / occurrence history</text><text x="645" y="368" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Separate state and presentation frontiers.</text><text x="30" y="437" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Server-authoritative policy. Cooperative body streams and deterministic peers use different contracts.</text></svg>
