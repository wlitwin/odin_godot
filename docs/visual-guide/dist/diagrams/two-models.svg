y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">State + free procedures</text><path d="M235 130L268 130" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="212" width="445" height="83" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="47" y="241" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Registry + generated protocol</text><text x="47" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">owner fields / replicated fields / commands</text><path d="M372 170L372 210" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="194" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Each field declares its writer.</text><rect x="520" y="92" width="445" height="78" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="537" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">World at tick T</text><text x="537" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Players · pools · inventories · timers · RNG</text><rect x="520" y="212" width="205" height="83" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="537" y="241" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">step(world, input)</text><text x="537" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Record the next frame</text><rect x="760" y="212" width="205" height="83" rx="5" fill="#eef2e7" stroke="#c8d1c1"/><text x="777" y="241" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Godot views</text><text x="777" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#58645c" text-anchor="start">Nodes · animation · audio</text><path d="M625 170L625 210" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M725 252L758 252" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="748" y="198" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#58645c" text-anchor="middle">copies + occurrences</text><path d="M255 295L255 335" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M625 295L625 335" fill="none" stroke="#58645c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="338" width="445" height="58" rx="5" fill="#e5eadd" stroke="#c8d1c1"/><text x="47" y="367" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Session / transport → other machines</text><rect x="520" y="338" width="445" height="58" rx="5" fill="#f1e4d8" stroke="#c8d1c1"/><text x="537" y="367" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#202925" text-anchor="start">Runner / transport → other machines</text><text x="30" y="418" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#58645c" text-anchor="start">Field-level declarations</text><text x="520" y="418" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#58645c" text-anchor="start">Complete-frame history</text></svg>
