<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Inside and outside a Replay frame</title><desc id="desc">The World holds all mutable gameplay dependencies: player values, chest existence, allocation metadata, timers, RNG, and scheduled work. Immutable content is versioned. Godot, transport, and storage are external.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1L7 4L0 7" fill="none" stroke="#b4c7b4" stroke-width="1.2"/></marker></defs><rect width="1000" height="420" fill="#1c302a"/><rect x="30" y="38" width="590" height="300" rx="5" fill="#223a30" stroke="#718965" stroke-dasharray="6 5"/><text x="50" y="69" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#d6ba8b" text-anchor="start">FRAME / WORLD AT TICK T</text><rect x="50" y="92" width="265" height="84" rx="5" fill="#294237" stroke="#597260"/><text x="67" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Players + inventories</text><text x="67" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Position · health · bags</text><rect x="335" y="92" width="265" height="84" rx="5" fill="#294237" stroke="#597260"/><text x="352" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Entity lifetime</text><text x="352" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Chest present? · pool generations</text><rect x="50" y="199" width="265" height="84" rx="5" fill="#294237" stroke="#597260"/><text x="67" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">RNG + cooldowns</text><text x="67" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Values that affect later ticks</text><rect x="335" y="199" width="265" height="84" rx="5" fill="#294237" stroke="#597260"/><text x="352" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Scheduled work</text><text x="352" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Timers · pending simulation work</text><text x="50" y="316" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#b4c7b4" text-anchor="start">Restored together; stepped together.</text><rect x="690" y="38" width="280" height="74" rx="5" fill="#294237" stroke="#597260"/><text x="707" y="67" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Immutable definitions</text><text x="707" y="91" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Content-versioned session inputs</text><path d="M690 85L622 85" fill="none" stroke="#b4c7b4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="690" y="169" width="280" height="86" rx="5" fill="#294237" stroke="#597260"/><text x="707" y="198" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Godot presentation</text><text x="707" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Nodes · resources · sound · UI</text><path d="M620 211L688 211" fill="none" stroke="#b4c7b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="652" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#b4c7b4" text-anchor="middle">views</text><rect x="690" y="304" width="280" height="74" rx="5" fill="#294237" stroke="#597260"/><text x="707" y="333" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#e7efdd" text-anchor="start">Session / I/O owners</text><text x="707" y="357" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#b4c7b4" text-anchor="start">Connections · storage · authority</text><text x="30" y="387" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#d6ba8b" text-anchor="start">INPUT + PREVIOUS FRAME</text><path d="M235 382L340 382" fill="none" stroke="#b4c7b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="365" y="387" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#e7efdd" text-anchor="start">step</text><path d="M411 382L512 382" fill="none" stroke="#b4c7b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="535" y="387" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#d6ba8b" text-anchor="start">NEXT FRAME + OCCURRENCES</text></svg>
