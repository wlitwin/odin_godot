; Browser build for itch.io and similar hosts: bash examples/box3d_offline/export_web.sh
; extensions_support selects Godot's dlink web template, which loads bin/libodin_godot.wasm
; (built by build/build_web.sh with Box3D linked in). thread_support needs the page to be
; cross-origin isolated; on itch.io tick "SharedArrayBuffer support".
[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.odin,*.gd,*.tscn,*.tres,*.gdextension,*.json"
exclude_filter=""
export_path="out/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
[preset.0.options]
variant/extensions_support=true
variant/thread_support=true
html/canvas_resize_policy=2
