; Normal Godot/SDK export. Source Resources/Odin/modules remain normal pack inputs.
; Native libraries/modules are deployed by the existing GDExtension/Odin exporter.
[preset.0]
name="macOS arm64"
platform="macOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.odin,*.gd,*.tres,*.tscn,*.gdextension,*.json,*.cfg"
exclude_filter="*.dSYM/*,**/.DS_Store,**/__pycache__/*"
export_path="exports/ReplayBox3DAuthoring.app"
patches=PackedStringArray()
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
[preset.0.options]
export/distribution_type=0
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
codesign/codesign=1
codesign/identity=""
codesign/apple_team_id=""
codesign/entitlements/disable_library_validation=true
notarization/notarization=0
application/bundle_identifier="org.odingodot.box3d.replayauthoring"
application/signature=""
application/app_category="Games"
application/short_version="1.0"
application/version="1.0"
application/min_macos_version_arm64="11.0"
display/high_res=true
