name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation build tools
        working-directory: docs
        run: npm ci

      - name: Check documentation links and navigation
        working-directory: docs
        run: nix develop ../.#docs --command npm run check

      - name: Check API extraction
        working-directory: docs
        run: nix develop ../.#docs --command npm run test:api

      - name: Check shared capacity definitions
        run: nix develop .#docs --command python3 build/box3d_capacity.py --check

      - name: Build documentation
        working-directory: docs
        run: nix develop ../.#docs --command npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
