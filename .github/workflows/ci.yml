# Small component contracts run once on each change. The full application matrix
# remains explicitly available in ci-extended.yml and tests/run_all.sh.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, kit, replay, utilities]
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install signaling-test dependency
        run: npm ci --ignore-scripts
      - name: Install Godot for engine contracts
        if: matrix.component == 'bridge' || matrix.component == 'replay'
        run: |
          curl -fsSLo godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Dump engine API
        if: matrix.component == 'bridge' || matrix.component == 'replay'
        run: nix develop --command make api-dump
      - name: Verify build-helper parity
        if: matrix.component == 'bridge'
        run: nix develop .#build-parity --command bash tests/build_helpers/run.sh
      - name: Verify runner and fixture helpers
        if: matrix.component == 'utilities'
        run: |
          set -euo pipefail
          mkdir -p tests/.logs
          nix develop --command python3 -m unittest discover -s tests/suite_runner -v 2>&1 | tee tests/.logs/runner-unit.log
          nix develop --command python3 -m unittest discover -s tests -p platform_test.py -v 2>&1 | tee tests/.logs/platform-unit.log
          nix develop --command python3 -m unittest discover -s tests -p import_project_test.py -v 2>&1 | tee tests/.logs/import-unit.log
      - name: Run component contracts
        timeout-minutes: 20
        run: nix develop --command bash tests/run_core.sh '${{ matrix.component }}'
      - name: Preserve results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-${{ matrix.component }}
          path: tests/.logs/
          include-hidden-files: true
